<!-- web/index.html -->
<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Garmin GPS Visualizer</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        :root {
            --leftW: 280px;
            --rightW: 380px;
        }

        body {
            margin: 0;
            height: 100vh;
            font-family: system-ui, sans-serif;
            display: grid;
            grid-template-columns: var(--leftW) 1fr 0px;
            overflow: hidden;
        }

        body.has-selection {
            grid-template-columns: var(--leftW) 1fr var(--rightW);
        }

        #left {
            border-right: 1px solid #ddd;
            padding: 12px;
            overflow: auto;
        }

        #map {
            height: 100vh;
        }

        #right {
            border-left: 1px solid #ddd;
            padding: 12px;
            overflow: auto;
            display: none;
            background: #fff;
        }

        body.has-selection #right {
            display: block;
        }

        h2,
        h3 {
            margin: 8px 0;
        }

        hr {
            border: none;
            border-top: 1px solid #eee;
            margin: 12px 0;
        }

        .row {
            margin: 10px 0;
        }

        .two {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .two>* {
            flex: 1;
        }

        input,
        button {
            width: 100%;
            box-sizing: border-box;
        }

        input:not([type="range"]) {
            padding: 8px;
        }

        select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }

        button {
            padding: 10px;
            cursor: pointer;
        }

        small {
            color: #666;
        }

        .mono {
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 12px;
        }

        #status {
            white-space: pre-wrap;
            font-size: 12px;
        }

        .item {
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #eee;
            border-radius: 10px;
        }

        .activityItem {
            cursor: pointer;
        }

        .activityItem:hover {
            background: #fafafa;
            border-color: #ddd;
        }

        /* Two-thumb single-line slider with filled range between thumbs */
        .rangeBox {
            position: relative;
            height: 34px;
        }

        .rangeTrack {
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            height: 6px;
            border-radius: 999px;
            background: #e9e9e9;
        }

        .rangeFill {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            height: 6px;
            border-radius: 999px;
            background: #111;
            left: 0%;
            width: 0%;
            opacity: 0.8;
            pointer-events: none;
        }

        .rangeBox input[type="range"] {
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            width: 100%;
            height: 34px;
            margin: 0;
            padding: 0;
            background: transparent;
            -webkit-appearance: none;
            appearance: none;
            pointer-events: none;
            /* overlap safely */
        }

        .rangeBox input[type="range"]::-webkit-slider-runnable-track {
            height: 6px;
            background: transparent;
        }

        .rangeBox input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            pointer-events: auto;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #111;
            border: 2px solid #fff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
            margin-top: -5px;
        }

        .rangeBox input[type="range"]::-moz-range-track {
            height: 6px;
            background: transparent;
        }

        .rangeBox input[type="range"]::-moz-range-thumb {
            pointer-events: auto;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #111;
            border: 2px solid #fff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
        }
    </style>
</head>

<body>
    <!-- LEFT SIDEBAR -->
    <div id="left">
        <h2>Garmin GPS Visualizer</h2>

        <div class="row">
            <label>View User ID (public)</label><br />
            <input id="viewUserId" placeholder="e.g. myuserid" />
        </div>

        <div class="row two">
            <button id="loadView">Load</button>
        </div>

        <div class="row">
            <label>Activity type</label><br />
            <select id="activityType" disabled></select>
        </div>

        <hr />

        <h3>Timeline filter</h3>
        <div class="row">
            <div class="rangeBox">
                <div class="rangeTrack"></div>
                <div id="rangeFill" class="rangeFill"></div>
                <input id="tStart" type="range" min="0" max="100" value="0" />
                <input id="tEnd" type="range" min="0" max="100" value="100" />
            </div>
            <div id="tLabel" class="mono">—</div>
        </div>

        <hr />

        <h3>Sync (Garmin login)</h3>

        <div class="row">
            <label>Email</label><br />
            <input id="email" type="email" placeholder="you@example.com" autocomplete="username" />
        </div>

        <div class="row">
            <label>Password</label><br />
            <input id="password" type="password" placeholder="Garmin password" autocomplete="current-password" />
            <small>Your password is used only for this sync and is never stored.</small>
        </div>

        <div class="row">
            <label>Spot radius (m)</label><br />
            <input id="spotRadius" type="number" value="1200" min="50" step="50" />
        </div>

        <div class="row">
            <button id="sync">Sync</button>
        </div>

        <div class="row">
            <div><b>User ID</b>: <span id="derivedUserId" class="mono">—</span></div>
        </div>

        <hr />

        <div class="row">
            <div id="status"></div>
        </div>

    </div>

    <!-- MAP -->
    <div id="map"></div>

    <!-- RIGHT SIDEBAR -->
    <div id="right">
        <div class="two" style="align-items:center;">
            <h3 style="margin:0;">Selection</h3>
            <button id="closeRight" style="max-width:120px;">Close</button>
        </div>
        <div id="rightContent" class="row"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // ----------------------------
        // Helpers
        // ----------------------------
        function userIdFromEmail(email) {
            const local = (email || "").split("@")[0] || "";
            return local.toLowerCase().replace(/[^a-z0-9]/g, "");
        }
        function setStatus(msg) { document.getElementById("status").textContent = msg; }
        function saveLS(key, value) { try { localStorage.setItem(key, value); } catch { } }
        function loadLS(key) { try { return localStorage.getItem(key) || ""; } catch { return ""; } }
        function parseTime(s) { const t = Date.parse(s || ""); return Number.isFinite(t) ? t : NaN; }
        function fmtTime(ms) {
            if (!Number.isFinite(ms)) return "—";
            return new Date(ms).toISOString().slice(0, 16).replace("T", " ");
        }
        function fmtTypeLabel(typeKey) {
            const k = String(typeKey || "unknown").replace(/_/g, " ").trim();
            if (!k) return "Unknown";
            return k.split(/\s+/).map(w => w ? (w[0].toUpperCase() + w.slice(1)) : w).join(" ");
        }

        async function fetchActivityTypes(userId) {
            const r = await fetch(`/api/${userId}/types`);
            if (!r.ok) {
                const err = await r.json().catch(() => ({}));
                throw new Error(err.detail || "Failed to load activity types");
            }
            const items = await r.json();
            return Array.isArray(items) ? items : [];
        }

        function showRight(html) {
            document.body.classList.add("has-selection");
            document.getElementById("rightContent").innerHTML = html;
        }
        function hideRight() {
            document.body.classList.remove("has-selection");
            document.getElementById("rightContent").innerHTML = "";
            selectedSpot = null;
            selectedActivityId = null;
            highlightSelectedActivity();
        }

        // ----------------------------
        // Map
        // ----------------------------
        const map = L.map("map").setView([28.0, -16.6], 11);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19 }).addTo(map);

        const tracksGroup = L.layerGroup().addTo(map);
        const spotsGroup = L.layerGroup().addTo(map);

        let suppressNextMapClick = false;
        map.on("click", () => {
            if (suppressNextMapClick) {
                suppressNextMapClick = false;
                return;
            }
            hideRight();
        });

        const spotPinIcon = L.icon({
            iconUrl: "/web/marker.png",
            iconSize: [34, 34],
            iconAnchor: [17, 34],
            popupAnchor: [0, -34]
        });

        // ----------------------------
        // State
        // ----------------------------
        let currentUserId = null;
        let currentTypeKey = null;
        let activities = [];       // all metadata
        let timelineTimes = [];    // sorted ms

        // selection state (for re-render when timeline changes)
        let selectedSpot = null;         // {id, lat, lon, activityIds}
        let selectedActivityId = null;   // number

        // fetch-once caches
        const geoCache = new Map();     // activityId -> feature
        const inflight = new Map();     // activityId -> promise
        const layerById = new Map();    // activityId -> leaflet layer
        const spotActivitiesCache = new Map(); // `${spotId}:${radius}` -> activities
        const spotActivitiesInflight = new Map(); // `${spotId}:${radius}` -> promise

        let timelineUpdateSeq = 0;
        let timelineUpdateTimer = null;

        function clearAll() {
            tracksGroup.clearLayers();
            spotsGroup.clearLayers();
            activities = [];
            currentUserId = null;

            geoCache.clear();
            inflight.clear();
            layerById.clear();
            spotActivitiesCache.clear();
            spotActivitiesInflight.clear();

            if (timelineUpdateTimer) {
                clearTimeout(timelineUpdateTimer);
                timelineUpdateTimer = null;
            }

            document.getElementById("tLabel").textContent = "—";
            updateRangeFill();
            hideRight();
            setStatus("Cleared.");
        }

        async function loadActivities(userId, typeKey) {
            const q = new URLSearchParams();
            if (typeKey) q.set("type", typeKey);
            const suffix = q.toString() ? `?${q.toString()}` : "";
            const r = await fetch(`/api/${userId}/activities${suffix}`);
            if (!r.ok) {
                const err = await r.json().catch(() => ({}));
                throw new Error(err.detail || "Failed to load activities");
            }
            activities = await r.json();
        }

        async function getFeatureOnce(userId, activityId) {
            const key = String(activityId);
            if (geoCache.has(key)) return geoCache.get(key);
            if (inflight.has(key)) return inflight.get(key);

            const p = (async () => {
                const r = await fetch(`/api/${userId}/activity/${activityId}/geojson`, { cache: "force-cache" });
                if (!r.ok) {
                    const err = await r.json().catch(() => ({}));
                    throw new Error(err.detail || `Failed geojson for ${activityId}`);
                }
                const feature = await r.json();
                geoCache.set(key, feature);
                inflight.delete(key);
                return feature;
            })();

            inflight.set(key, p);
            return p;
        }

        // ----------------------------
        // Timeline (enforce start <= end and fill between)
        // ----------------------------
        function computeTimeline() {
            timelineTimes = activities
                .map(a => parseTime(a.startTime))
                .filter(t => Number.isFinite(t))
                .sort((a, b) => a - b);

            const steps = Math.max(timelineTimes.length - 1, 1);
            const tStart = document.getElementById("tStart");
            const tEnd = document.getElementById("tEnd");
            tStart.min = "0"; tStart.max = String(steps); tStart.value = "0";
            tEnd.min = "0"; tEnd.max = String(steps); tEnd.value = String(steps);
            updateRangeFill();
        }

        function clampOrder() {
            const tStart = document.getElementById("tStart");
            const tEnd = document.getElementById("tEnd");
            let a = Number(tStart.value);
            let b = Number(tEnd.value);

            // enforce: start <= end (left may not pass right)
            if (a > b) {
                // decide which moved by checking active element
                if (document.activeElement === tStart) {
                    a = b;
                    tStart.value = String(a);
                } else {
                    b = a;
                    tEnd.value = String(b);
                }
            }
        }

        function updateRangeFill() {
            const tStart = document.getElementById("tStart");
            const tEnd = document.getElementById("tEnd");
            const fill = document.getElementById("rangeFill");

            const min = Number(tStart.min);
            const max = Number(tStart.max);
            const a = Number(tStart.value);
            const b = Number(tEnd.value);

            const lo = Math.min(a, b);
            const hi = Math.max(a, b);
            const pctLo = (lo - min) / (max - min) * 100;
            const pctHi = (hi - min) / (max - min) * 100;

            fill.style.left = pctLo + "%";
            fill.style.width = (pctHi - pctLo) + "%";
        }

        function currentRangeMs() {
            const tStart = document.getElementById("tStart");
            const tEnd = document.getElementById("tEnd");

            let i0 = Number(tStart.value);
            let i1 = Number(tEnd.value);
            if (i0 > i1) [i0, i1] = [i1, i0];

            if (!timelineTimes.length) {
                const now = Date.now();
                return [now - 86400 * 1000 * 30, now];
            }
            return [timelineTimes[i0], timelineTimes[i1]];
        }

        function visibleActivitiesByTime(startMs, endMs) {
            return activities.filter(a => {
                if (a.meanLat == null || a.meanLon == null) return false;
                const t = parseTime(a.startTime);
                if (!Number.isFinite(t)) return true;
                return t >= startMs && t <= endMs;
            });
        }

        // ----------------------------
        // Tracks rendering
        // ----------------------------
        const TRACK_BASE_STYLE = { weight: 2, opacity: 0.55, color: "#3388ff" };
        const TRACK_SELECTED_STYLE = { weight: 2, opacity: 0.95, color: "#ff7a00" };

        function bringLayerToFront(layer) {
            if (!layer) return;
            if (typeof layer.eachLayer === "function") {
                layer.eachLayer((child) => {
                    if (typeof child?.bringToFront === "function") child.bringToFront();
                });
                return;
            }
            if (typeof layer.bringToFront === "function") layer.bringToFront();
        }

        function highlightSelectedActivity() {
            for (const [aid, layer] of layerById.entries()) {
                const isSelected = selectedActivityId !== null && String(selectedActivityId) === String(aid);
                if (typeof layer?.setStyle === "function") {
                    layer.setStyle(isSelected ? TRACK_SELECTED_STYLE : TRACK_BASE_STYLE);
                }
                if (isSelected) bringLayerToFront(layer);
            }
        }

        async function renderVisibleTracks(visible, seq) {
            if (!currentUserId) return;

            const want = new Set(visible.map(a => String(a.activityId)));

            for (const [aid, layer] of layerById.entries()) {
                if (!want.has(aid)) {
                    tracksGroup.removeLayer(layer);
                    layerById.delete(aid);
                }
            }

            highlightSelectedActivity();

            const missing = [];
            for (const a of visible) {
                const aid = String(a.activityId);
                if (!layerById.has(aid)) missing.push(a);
            }

            const fetched = await Promise.allSettled(
                missing.map(async (a) => ({ a, feature: await getFeatureOnce(currentUserId, a.activityId) }))
            );

            if (seq !== timelineUpdateSeq) return;

            for (const r of fetched) {
                if (r.status !== "fulfilled") continue;
                const { a, feature } = r.value;
                const aid = String(a.activityId);
                if (layerById.has(aid)) continue;

                const layer = L.geoJSON(feature, {
                    style: () => (String(selectedActivityId) === String(a.activityId) ? TRACK_SELECTED_STYLE : TRACK_BASE_STYLE),
                    onEachFeature: (f, l) => {
                        l.on("click", (ev) => {
                            suppressNextMapClick = true;
                            if (ev?.originalEvent) L.DomEvent.stopPropagation(ev.originalEvent);
                            selectedSpot = null;
                            selectedActivityId = Number(a.activityId);
                            showActivitySelection(selectedActivityId, { ...(f.properties || {}), activityId: a.activityId, name: a.name, startTime: a.startTime });
                            highlightSelectedActivity();
                        });
                    }
                });

                layer.addTo(tracksGroup);
                layerById.set(aid, layer);
            }
        }

        function showActivitySelection(activityId, props) {
            const meta = activities.find(a => Number(a.activityId) === Number(activityId));
            const name = props?.name || meta?.name || "Activity";
            const startTime = props?.startTime || meta?.startTime || "";
            showRight(`
        <div class="item">
          <b>Activity</b>
          <div class="mono">activityId: ${activityId}</div>
          <div>${name}</div>
          ${startTime ? `<div class="mono">${startTime}</div>` : ""}
          <div style="margin-top:8px;">
            <a href="/api/${currentUserId}/activity/${activityId}/open" target="_blank">Open in Garmin</a>
          </div>
        </div>
      `);
        }

        // ----------------------------
        // Spots rendering + selection (timeline-aware)
        // ----------------------------
        async function loadSpots(typeKey) {
            if (!currentUserId) return;
            const radius = Number(document.getElementById("spotRadius").value || 1200);

            const q = new URLSearchParams({ radius_m: String(radius) });
            if (typeKey) q.set("type", typeKey);
            const r = await fetch(`/api/${currentUserId}/spots?${q.toString()}`);
            if (!r.ok) {
                const err = await r.json().catch(() => ({}));
                throw new Error(err.detail || "Failed to load spots");
            }
            const spots = await r.json();

            spotsGroup.clearLayers();

            for (const s of spots) {
                const m = L.marker([s.lat, s.lon], { icon: spotPinIcon, keyboard: false }).addTo(spotsGroup);
                m.on("click", async (ev) => {
                    suppressNextMapClick = true;
                    if (ev?.originalEvent) L.DomEvent.stopPropagation(ev.originalEvent);
                    selectedActivityId = null;
                    selectedSpot = s;
                    highlightSelectedActivity();
                    await showSpotSelection(s);
                });
            }
        }

        function spotActsCacheKey(spotId, radius, typeKey) {
            return `${typeKey || ""}:${spotId}:${radius}`;
        }

        async function getSpotActivities(spotId, radius, typeKey) {
            const key = spotActsCacheKey(spotId, radius, typeKey);
            if (spotActivitiesCache.has(key)) return spotActivitiesCache.get(key);
            if (spotActivitiesInflight.has(key)) return spotActivitiesInflight.get(key);

            const p = (async () => {
                const q = new URLSearchParams({ radius_m: String(radius) });
                if (typeKey) q.set("type", typeKey);
                const rr = await fetch(`/api/${currentUserId}/spot/${spotId}/activities?${q.toString()}`);
                if (!rr.ok) {
                    const err = await rr.json().catch(() => ({}));
                    throw new Error(err.detail || "Failed to load spot activities");
                }

                const acts = await rr.json();
                spotActivitiesCache.set(key, acts);
                spotActivitiesInflight.delete(key);
                return acts;
            })();

            spotActivitiesInflight.set(key, p);
            return p;
        }

        async function showSpotSelection(spot, startMs = null, endMs = null) {
            const radius = Number(document.getElementById("spotRadius").value || 1200);
            const [sMs, eMs] = (startMs === null || endMs === null) ? currentRangeMs() : [startMs, endMs];

            const acts = await getSpotActivities(spot.id, radius, currentTypeKey);

            // Apply timeline filter client-side to the spot activities list
            const filtered = acts.filter(a => {
                const t = parseTime(a.startTime);
                if (!Number.isFinite(t)) return true;
                return t >= sMs && t <= eMs;
            });

            const items = filtered.map(a => `
        <div class="item activityItem" data-activity-id="${a.activityId}">
          <b>${a.name || "Windsurfing"}</b>
          ${a.startTime ? `<div class="mono">${a.startTime}</div>` : ""}
          <div style="margin-top:8px;">
            <a href="/api/${currentUserId}/activity/${a.activityId}/open" target="_blank">Open in Garmin</a>
          </div>
        </div>
      `).join("");

            showRight(`
        <div class="item">
          <b>Spot ${spot.id}</b>
          <div class="mono">${filtered.length} activities (filtered by timeline)</div>
        </div>
        ${items || `<div class="item"><small>No activities in the selected time window.</small></div>`}
      `);
        }

        // ----------------------------
        // Timeline change handler (throttled; also updates current selection)
        // ----------------------------
        function applyTimelineUiOnly() {
            clampOrder();
            updateRangeFill();

            const [a, b] = currentRangeMs();
            document.getElementById("tLabel").textContent = `${fmtTime(a)}  →  ${fmtTime(b)}`;
            return [a, b];
        }

        async function runTimelineUpdate(seq, a, b) {
            const visible = visibleActivitiesByTime(a, b);
            await renderVisibleTracks(visible, seq);
            if (seq !== timelineUpdateSeq) return;

            // If a spot is selected, re-render its activity list with the new timeline
            if (selectedSpot) {
                await showSpotSelection(selectedSpot, a, b);
            }
            if (seq !== timelineUpdateSeq) return;

            // If a single activity is selected, keep the right sidebar open
            if (selectedActivityId) {
                const feat = geoCache.get(String(selectedActivityId));
                const props = feat?.properties || { activityId: selectedActivityId };
                showActivitySelection(selectedActivityId, props);
            }
            if (seq !== timelineUpdateSeq) return;

            setStatus(
                `Visible tracks: ${visible.length}\n` +
                `geoCache: ${geoCache.size}\n` +
                `spots: ${spotsGroup.getLayers().length}`
            );
        }

        function scheduleTimelineUpdate() {
            const [a, b] = applyTimelineUiOnly();
            const seq = ++timelineUpdateSeq;

            if (timelineUpdateTimer) clearTimeout(timelineUpdateTimer);
            timelineUpdateTimer = setTimeout(() => {
                runTimelineUpdate(seq, a, b).catch(e => setStatus(String(e)));
            }, 50);
        }

        async function updateTimelineNow() {
            if (timelineUpdateTimer) {
                clearTimeout(timelineUpdateTimer);
                timelineUpdateTimer = null;
            }
            const [a, b] = applyTimelineUiOnly();
            const seq = ++timelineUpdateSeq;
            await runTimelineUpdate(seq, a, b);
        }

        async function loadType(typeKey) {
            if (!currentUserId) return;

            currentTypeKey = (typeKey || "").trim().toLowerCase() || null;
            saveLS(`type_${currentUserId}`, currentTypeKey || "");

            tracksGroup.clearLayers();
            layerById.clear();
            spotsGroup.clearLayers();
            spotActivitiesCache.clear();
            spotActivitiesInflight.clear();
            hideRight();

            setStatus(`Loading ${fmtTypeLabel(currentTypeKey)} activities for ${currentUserId}...`);
            await loadActivities(currentUserId, currentTypeKey);
            setStatus(`Loaded ${activities.length} activities.`);

            computeTimeline();

            const tStart = document.getElementById("tStart");
            const tEnd = document.getElementById("tEnd");
            tStart.oninput = () => scheduleTimelineUpdate();
            tEnd.oninput = () => scheduleTimelineUpdate();

            await loadSpots(currentTypeKey);
            await updateTimelineNow();
        }

        async function loadUser(userId) {
            tracksGroup.clearLayers();
            spotsGroup.clearLayers();
            layerById.clear();
            hideRight();

            if (currentUserId !== userId) {
                geoCache.clear();
                inflight.clear();
                spotActivitiesCache.clear();
                spotActivitiesInflight.clear();
            }

            currentUserId = userId;

            typeSelect.disabled = true;
            typeSelect.innerHTML = "";
            currentTypeKey = null;

            setStatus(`Loading activity types for ${userId}...`);
            const types = await fetchActivityTypes(userId);
            if (!types.length) {
                setStatus("No activity types found. Sync first.");
                return;
            }

            const savedType = loadLS(`type_${userId}`).trim().toLowerCase();
            const preferred = (types.find(t => String(t.typeKey).toLowerCase() === savedType)?.typeKey) || types[0].typeKey;

            for (const t of types) {
                const opt = document.createElement("option");
                opt.value = t.typeKey;
                opt.textContent = `${fmtTypeLabel(t.typeKey)} (${t.count})`;
                typeSelect.appendChild(opt);
            }

            typeSelect.value = preferred;
            typeSelect.disabled = false;

            await loadType(preferred);
        }

        // ----------------------------
        // Wiring
        // ----------------------------
        const viewUserId = document.getElementById("viewUserId");
        const loadViewBtn = document.getElementById("loadView");
        const typeSelect = document.getElementById("activityType");
        const closeRightBtn = document.getElementById("closeRight");
        const rightContent = document.getElementById("rightContent");

        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const spotRadiusInput = document.getElementById("spotRadius");
        const derivedUserIdSpan = document.getElementById("derivedUserId");
        const syncBtn = document.getElementById("sync");

        emailInput.value = loadLS("garmin_email");
        viewUserId.value = loadLS("view_userid");
        derivedUserIdSpan.textContent = userIdFromEmail(emailInput.value) || "—";

        const urlUid = new URLSearchParams(window.location.search).get("uid");
        if (urlUid && urlUid.trim()) {
            const uid = urlUid.trim();
            viewUserId.value = uid;
            saveLS("view_userid", uid);
            loadUser(uid).catch(e => setStatus(String(e)));
        } else if (viewUserId.value.trim()) {
            loadUser(viewUserId.value.trim()).catch(e => setStatus(String(e)));
        }

        emailInput.addEventListener("input", () => {
            const email = emailInput.value.trim();
            derivedUserIdSpan.textContent = userIdFromEmail(email) || "—";
            if (email) saveLS("garmin_email", email);
        });

        viewUserId.addEventListener("input", () => {
            const uid = viewUserId.value.trim();
            if (uid) saveLS("view_userid", uid);
        });

        closeRightBtn.onclick = () => hideRight();

        typeSelect.addEventListener("change", () => {
            if (!currentUserId) return;
            loadType(typeSelect.value).catch(e => setStatus(String(e)));
        });

        rightContent.addEventListener("click", async (ev) => {
            const target = ev.target;
            if (target?.closest?.("a")) return;

            const el = target?.closest?.("[data-activity-id]");
            if (!el) return;

            const activityId = Number(el.getAttribute("data-activity-id"));
            if (!Number.isFinite(activityId)) return;

            suppressNextMapClick = true;
            selectedSpot = null;
            selectedActivityId = activityId;

            const meta = activities.find(a => Number(a.activityId) === activityId);

            if (meta && !layerById.has(String(activityId))) {
                try {
                    const feature = await getFeatureOnce(currentUserId, activityId);
                    const layer = L.geoJSON(feature, {
                        style: () => (String(selectedActivityId) === String(activityId) ? TRACK_SELECTED_STYLE : TRACK_BASE_STYLE),
                        onEachFeature: (f, l) => {
                            l.on("click", (e2) => {
                                suppressNextMapClick = true;
                                if (e2?.originalEvent) L.DomEvent.stopPropagation(e2.originalEvent);
                                selectedSpot = null;
                                selectedActivityId = activityId;
                                showActivitySelection(selectedActivityId, { ...(f.properties || {}), activityId, name: meta?.name, startTime: meta?.startTime });
                                highlightSelectedActivity();
                            });
                        }
                    }).addTo(tracksGroup);
                    layerById.set(String(activityId), layer);
                } catch (e) {
                    setStatus(String(e));
                }
            }

            showActivitySelection(activityId, { activityId, name: meta?.name, startTime: meta?.startTime });
            highlightSelectedActivity();
        });

        loadViewBtn.onclick = async () => {
            const uid = (viewUserId.value || "").trim();
            if (!uid) { setStatus("Enter a userId to view."); return; }
            saveLS("view_userid", uid);
            try { await loadUser(uid); }
            catch (e) { setStatus(String(e)); }
        };

        // Auto-refresh spots if radius changes; also update selected spot list to reflect new spot definition
        spotRadiusInput.addEventListener("change", async () => {
            if (!currentUserId) return;
            try {
                spotActivitiesCache.clear();
                spotActivitiesInflight.clear();
                await loadSpots(currentTypeKey);
                if (selectedSpot) {
                    // selectedSpot id may shift after reclustering; safest: close selection
                    hideRight();
                }
                await updateTimelineNow();
            } catch (e) {
                setStatus(String(e));
            }
        });

        syncBtn.onclick = async () => {
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            const spotRadius = Number(spotRadiusInput.value || 1200);

            if (!email || !password) {
                setStatus("Enter email + password to sync.");
                return;
            }

            const derived = userIdFromEmail(email);
            derivedUserIdSpan.textContent = derived;

            const prevSyncText = syncBtn.textContent;
            syncBtn.textContent = "Syncing (might take a couple of minutes)...";
            setStatus("Syncing (might take a couple of minutes)...");
            syncBtn.disabled = true;

            try {
                const resp = await fetch("/api/sync", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password, spot_radius_m: spotRadius })
                });

                const payload = await resp.json().catch(() => ({}));
                if (!resp.ok) {
                    const d = payload.detail;
                    throw new Error(typeof d === "string" ? d : (d?.error || "Sync failed"));
                }

                viewUserId.value = payload.user_id;
                saveLS("view_userid", payload.user_id);

                setStatus(
                    `Sync OK\nuser_id: ${payload.user_id}\nindexed: ${payload.indexed}\nnew GPX uploaded: ${payload.new_gpx_uploaded}\nlast_sync: ${payload.last_sync}`
                );

                await loadUser(payload.user_id);

            } catch (e) {
                setStatus(String(e));
            } finally {
                syncBtn.disabled = false;
                syncBtn.textContent = prevSyncText;
            }
        };
    </script>
</body>

</html>
